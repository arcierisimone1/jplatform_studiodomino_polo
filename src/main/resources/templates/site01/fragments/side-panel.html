<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="side-panel">
    <div class="it-offcanvas-area">
        <div class="itoffcanvas" id="itoffcanvasSide">
            <div class="itoffcanvas__close-btn">
                <button class="close-btn" type="button" data-sidepanel-close aria-label="Chiudi">
                    <i class="fal fa-times"></i>
                </button>
            </div>
            <div class="itoffcanvas__logo">
                <img class="mb-15" th:src="@{/images/logo_principale.png}" alt="Logo"/>
            </div>
            <div class="itoffcanvas__text">
                <p>Formazione, Consulenza e Sviluppo.</p>
            </div>

            <div class="widget mb-20">
                <h4 class="offcanva-title">Calendario corsi in partenza</h4>
                <div class="latest-posts">
                    <th:block th:if="${config != null and config.contenutiFront05 != null}">
                        <th:block th:each="articolo : ${config.contenutiFront05}">
                            <article class="post media-post clearfix pb-0 mb-20 d-flex align-items-center" style="gap:15px;">
                                <a class="post-thumb" th:href="@{'/' + ${articolo.url}}" th:if="${articolo.relazione != null}" style="flex:0 0 60px;">
                                    <img th:src="${config.imagesRepositoryWeb + articolo.relazione.logo}" alt="" style="width:60px;height:60px;object-fit:cover;border-radius:8px;"/>
                                </a>
                                <div class="post-right">
                                    <span class="d-block small text-muted" th:text="${articolo.dataVisualizzata}">Data</span>
                                    <h6 class="mt-0 mb-0"><a th:href="@{'/' + ${articolo.url}}" th:text="${articolo.titolo}">Titolo</a></h6>
                                </div>
                            </article>
                        </th:block>
                    </th:block>
                </div>
            </div>

            <div class="itoffcanvas__info">
                <h3 class="offcanva-title">Contatti</h3>
                <div class="it-info-wrapper mb-20 d-flex align-items-center">
                    <div class="itoffcanvas__info-icon"><i class="fal fa-map-marker-alt"></i></div>
                    <div class="itoffcanvas__info-address">
                        <span>Sede</span>
                        Studiodomino srl
                    </div>
                </div>
                <div class="it-info-wrapper mb-20 d-flex align-items-center">
                    <div class="itoffcanvas__info-icon"><a href="tel:+390971445096"><i class="fal fa-phone-alt"></i></a></div>
                    <div class="itoffcanvas__info-address">
                        <li><span>Telefono:</span><a href="tel:0971445096">0971 445096</a><a href="tel:366 6844615">366 6844615</a></li>
                    </div>
                </div>
                <div class="it-info-wrapper mb-20 d-flex align-items-center">
                    <div class="itoffcanvas__info-icon"><a href="mailto:info@studiodomino.com"><i class="fal fa-envelope"></i></a></div>
                    <div class="itoffcanvas__info-address">
                        <span>Email</span>
                        <a href="mailto:info@studiodomino.com">info@studiodomino.com</a>
                    </div>
                </div>
                <div class="it-info-wrapper mb-20 d-flex align-items-center">
                    <div class="itoffcanvas__info-icon"><i class="fas fa-map-marker-alt"></i></div>
                    <div class="itoffcanvas__info-address">
                        <span>Indirizzo</span>
                        Via del Gallitello, 74 | 85100 | Potenza (IT)
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="body-overlay" id="sidepanel-overlay"></div>
</th:block>
