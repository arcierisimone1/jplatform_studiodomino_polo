<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Sidebar comune riusata da tutte le sectionXxxSidebar.
  Ricostruita sul markup reale del tema Educeet (it-shop-sidebar /
  sidebar-widget / sidebar-widget-title / rc-post), come in
  BlogSidebarArea.tsx del template originale. Le classi precedenti
  (bg-very-light-gray, border-radius-6px, icon-feather-*, elements-social)
  non esistono nel CSS di Educeet: la sidebar risultava senza stile,
  come testo grezzo.

  Widget "Corsi in Partenza" mostrato SOLO per le pagine di
  corsi/catalogo (section.sectionType.page3 tra i 5 tipi Catalogo).
  Per tutte le altre pagine viene mostrato invece un widget con le
  altre sezioni della stessa categoria di menu (dropdown) di primo
  livello a cui la pagina corrente appartiene, come nel vecchio sito
  (es. "Tech&Learn" mostra le altre voci del dropdown "Home").
  NB: non si può usare la sintassi di selezione SpEL ".?[...]" per
  cercare la sezione di primo livello in config.sezioniFront perché al
  suo interno i nomi non prefissati (e anche "#nomeVar") vengono
  risolti contro l'elemento della lista e non contro le variabili
  locali di Thymeleaf: si ottiene sempre lista vuota. Si usa quindi un
  semplice th:each + th:if.
-->
<div th:fragment="widget" class="it-shop-sidebar position-sticky" style="top:100px;"
     th:with="isCorso=${section != null and section.sectionType != null and section.sectionType.page3 != null and (section.sectionType.page3 == 'sectionCatalogoSidebar' or section.sectionType.page3 == 'sectionCatalogoLiberiSidebar' or section.sectionType.page3 == 'sectionCatalogoAltaFormazioneSidebar' or section.sectionType.page3 == 'sectionCatalogoQualificaSidebar' or section.sectionType.page3 == 'sectionCatalogoLaureaSidebar')},
              topId=${breadcrumb != null and breadcrumb.items != null and !breadcrumb.items.isEmpty() ? breadcrumb.items[0].id : (section != null ? section.id : null)}">

    <!-- Widget: Contenuti correlati (ExtraTag slot 1, se popolato) -->
    <div th:if="${section.extratag != null and section.extratag.hasContenutiInSlot(1)}" class="sidebar-widget mb-60">
        <h4 class="sidebar-widget-title mb-25">Correlati</h4>
        <div class="sidebar-widget-content">
            <div class="sidebar-widget-post">
                <ul>
                    <li th:each="related : ${section.extratag.getExtraTagByNumber(1)}">
                        <div class="rc-post">
                            <div class="rc-post-content">
                                <div class="rc-meta mb-10" th:if="${related.dataVisualizzata != null}">
                                    <span><i class="fa-solid fa-calendar-days"></i> <span th:text="${related.dataVisualizzata}">Data</span></span>
                                </div>
                                <h5 class="rc-post-title">
                                    <a class="border-line" th:href="@{'/' + ${related.url}}" th:text="${related.titolo}">Contenuto correlato</a>
                                </h5>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Widget: Corsi in partenza (stessa fonte dati usata in home/side-panel) - solo per pagine di corsi/catalogo -->
    <div th:if="${isCorso and config != null and config.contenutiFront05 != null and !#lists.isEmpty(config.contenutiFront05)}" class="sidebar-widget mb-60">
        <h4 class="sidebar-widget-title mb-25">Corsi in Partenza</h4>
        <div class="sidebar-widget-content">
            <div class="sidebar-widget-post">
                <ul>
                    <li th:each="articolo, iterStat : ${config.contenutiFront05}" th:if="${iterStat.index < 5}">
                        <div class="rc-post">
                            <div class="rc-post-thumb mb-20" th:if="${articolo.logo != null and !articolo.logo.isEmpty()}">
                                <a th:href="@{'/' + ${articolo.url}}">
                                    <img th:src="${config.imagesRepositoryWeb + articolo.logo}" th:alt="${articolo.titolo}"/>
                                </a>
                            </div>
                            <div class="rc-post-content">
                                <div class="rc-meta mb-10" th:if="${articolo.dataVisualizzata != null}">
                                    <span><i class="fa-solid fa-calendar-days"></i> <span th:text="${articolo.dataVisualizzata}">Data</span></span>
                                </div>
                                <h5 class="rc-post-title">
                                    <a class="border-line" th:href="@{'/' + ${articolo.url}}" th:text="${articolo.titolo}">Corso</a>
                                </h5>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Widget: Altre sezioni della stessa categoria di menu - solo per pagine NON di corsi -->
    <th:block th:each="topSec : ${config != null and config.sezioniFront != null ? config.sezioniFront : {}}"
              th:if="${!isCorso and topId != null and topSec.id == topId and topSec.subsection != null and !#lists.isEmpty(topSec.subsection)}">
        <div class="sidebar-widget mb-60">
            <h4 class="sidebar-widget-title mb-25" th:text="${topSec.titolo}">Categoria</h4>
            <div class="sidebar-widget-content">
                <ul style="list-style:none; padding:0; margin:0;">
                    <li th:each="sib : ${topSec.subsection}" th:if="${sib.menu1.toString() != '0' and (section == null or sib.id != section.id)}" style="margin-bottom:15px;">
                        <a class="sidebar-widget-list" th:href="@{'/' + ${sib.url}}" th:text="${sib.titolo}">Sezione</a>
                    </li>
                </ul>
            </div>
        </div>
    </th:block>

</div>
</body>
</html>
