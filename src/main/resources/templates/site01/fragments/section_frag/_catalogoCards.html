<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Griglia di card corso, stesso schema dati/markup di homeTiles_02 (it-course-item),
  riusata da tutte le sectionCatalogoXxxSidebar.
-->
<div th:fragment="cards">
    <div class="row gx-35" th:if="${section.hasContenuti()}">
        <div class="col-xl-4 col-lg-6 col-md-6 mb-35" th:each="articolo : ${section.contenuti}">
            <div class="it-course-item">
                <div class="it-course-thumb z-index-1 border-radius-20">
                    <a th:href="@{'/' + ${articolo.url}}">
                        <img class="w-100" th:src="${config.imagesRepositoryWeb + articolo.logo}" th:alt="${articolo.titolo}"/>
                    </a>
                    <span class="course-category" th:if="${articolo.dataVisualizzata != null}" th:text="${articolo.dataVisualizzata}">Data avvio</span>
                </div>
                <div class="it-course-content p-relative">
                    <h5 class="it-course-title mb-20">
                        <a class="border-line" th:href="@{'/' + ${articolo.url}}" th:text="${articolo.titolo}">Titolo corso</a>
                    </h5>
                    <div class="it-course-meta mb-10 d-flex justify-content-between flex-wrap gap-2">
                        <span th:if="${articolo.s5 != null and !articolo.s5.isEmpty()}"><i class="fa-light fa-euro-sign"></i> <span th:text="${articolo.s5}">Prezzo</span></span>
                        <span th:if="${articolo.s6 != null and !articolo.s6.isEmpty()}"><i class="fa-light fa-clock"></i> <span th:text="${articolo.s6} + ' ore'">Ore</span></span>
                        <span th:if="${articolo.text1 != null and !articolo.text1.isEmpty()}"><i class="fa-light fa-map-marker-alt"></i> <span th:text="${articolo.text1}">Sede</span></span>
                    </div>
                    <p class="mb-0" th:if="${articolo.riassunto != null and !articolo.riassunto.isEmpty()}" th:text="${articolo.riassunto}">Riassunto</p>
                </div>
            </div>
        </div>
    </div>

    <div class="alert alert-light text-center" th:unless="${section.hasContenuti()}">
        Nessun corso disponibile al momento in questa categoria.
    </div>
</div>
</body>
</html>
