<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- ========================================
     FRAGMENT: Sezione Azienda + Organigramma/Team
     sectionType.page3 = 'sectionAzienda'
     Identica a sectionWebSidebar (testo + sidebar Info/Condividi/Corsi),
     ma sotto il testo aggiunge la griglia del team (section.contenuti di
     tipo Persona, gestiti col form manager "dettaglioContenutoPersona").
     Campi persona: titolo = nome, logo = foto, text1 = ruolo.
     ======================================== -->
<th:block th:fragment="content">

    <section class="pt-0 pb-100">
        <div class="container">
            <div class="row gx-35">

                <!-- CONTENUTO PRINCIPALE -->
                <div class="col-lg-8">

                    <!-- Testo della sezione (descrizione azienda) -->
                    <div class="section-content" th:if="${section.testo != null and !section.testo.isEmpty()}">
                        <div th:utext="${section.testo}" class="mb-40"></div>
                    </div>

                    <!-- ============================================
                         ORGANIGRAMMA / IL NOSTRO TEAM
                         Mostra le persone inserite come "contenuti" di
                         questa sezione (tipo Persona).
                         ============================================ -->
                    <div class="mb-40" th:if="${section.hasContenuti()}">
                        <h3 class="it-section-title mb-30">Il Nostro Team</h3>
                        <div class="row gx-35">
                            <div class="col-md-6 col-sm-6" th:each="persona : ${section.contenuti}">
                                <div class="it-team-item text-center p-relative mb-35">
                                    <div class="it-team-content-box">
                                        <div class="it-team-content">
                                            <h4 class="it-team-title">
                                                <a class="border-line" th:href="@{'/' + ${persona.url}}" th:text="${persona.titolo}">Nome Cognome</a>
                                            </h4>
                                            <span th:if="${persona.text1 != null and !persona.text1.isEmpty()}" th:utext="${persona.text1}">Ruolo</span>
                                        </div>
                                    </div>
                                    <div class="it-team-thumb p-relative border-radius-20">
                                        <img th:if="${persona.logo != null and !persona.logo.isEmpty()}"
                                             class="w-100" th:src="${config.imagesRepositoryWeb + persona.logo}" th:alt="${persona.titolo}"/>
                                        <img th:unless="${persona.logo != null and !persona.logo.isEmpty()}"
                                             class="w-100" th:src="@{/site01/assets/img/team/team-1-1.jpg}" th:alt="${persona.titolo}"/>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- SIDEBAR -->
                <div class="col-lg-4">
                    <div th:replace="~{site01/fragments/section_frag/_sidebar :: widget}"></div>
                </div>

            </div>
        </div>
    </section>

</th:block>

</body>
</html>
