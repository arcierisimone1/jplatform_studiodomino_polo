<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- sectionType.page3 = 'sectionContentsIconList'
     Ricostruita con le card reali "ChooseFive/Six" di Educeet
     (it-choose-2-item: card bianca con ombra, icona, titolo, testo),
     al posto del semplice "icona+testo" senza classi Educeet. -->
<th:block th:fragment="content">
    <section class="pb-100">
        <div class="container">

            <div class="row">
                <div class="col-lg-10 col-xl-9 mx-auto">
                    <div th:if="${section.testo != null and !section.testo.isEmpty()}" th:utext="${section.testo}" class="mb-40"></div>
                </div>
            </div>

            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 gx-35" th:if="${section.hasContenuti()}">
                <div class="col mb-35" th:each="articolo : ${section.contenuti}">
                    <div class="it-choose-2-item h-100">
                        <span class="it-choose-2-icon">
                            <i class="fa-solid fa-circle-check" style="font-size:32px; color: var(--it-theme-2);"></i>
                        </span>
                        <h5 class="it-choose-2-title" style="font-size:20px;">
                            <a th:href="@{'/' + ${articolo.url}}" class="border-line" th:text="${articolo.titolo}">Titolo</a>
                        </h5>
                        <div th:if="${articolo.riassunto != null and !articolo.riassunto.isEmpty()}" th:utext="${articolo.riassunto}">Descrizione</div>
                    </div>
                </div>
            </div>

            <div class="row" th:if="${!section.hasContenuti()}">
                <div class="col-lg-10 col-xl-9 mx-auto">
                    <div class="alert alert-light text-center">
                        Nessun contenuto disponibile al momento.
                    </div>
                </div>
            </div>

        </div>
    </section>
</th:block>
</body>
</html>
