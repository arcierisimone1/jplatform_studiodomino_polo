<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- sectionType.page3 = 'sectionListSidebarBlog' -->
<th:block th:fragment="content">
    <section class="pt-0">
        <div class="container">
            <div class="row">
                <div class="col-lg-8 pe-5 lg-pe-3 md-pe-15px md-mb-50">

                    <div th:if="${section.testo != null and !section.testo.isEmpty()}" th:utext="${section.testo}" class="mb-40"></div>

                    <div class="row gx-35" th:if="${section.hasContenuti()}">
                        <div class="col-lg-6 col-md-6" th:each="articolo : ${section.contenuti}">
                            <div class="it-blog-item mb-35">
                                <div class="it-blog-thumb border-radius-20 mb-30 p-relative">
                                    <a th:href="@{'/' + ${articolo.url}}">
                                        <img class="w-100" th:src="${config.imagesRepositoryWeb + articolo.logo}" th:alt="${articolo.titolo}"/>
                                    </a>
                                </div>
                                <div class="it-blog-content">
                                    <div class="it-blog-meta mb-25" th:if="${articolo.dataVisualizzata != null}">
                                        <span th:text="${articolo.dataVisualizzata}">Data</span>
                                    </div>
                                    <h5 class="it-blog-title mb-15">
                                        <a class="border-line" th:href="@{'/' + ${articolo.url}}" th:text="${articolo.titolo}">Titolo</a>
                                    </h5>
                                    <p class="mb-20" th:if="${articolo.riassunto != null}" th:text="${articolo.riassunto}"
                                       style="overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;">Riassunto</p>
                                    <div class="it-blog-btn">
                                        <a th:href="@{'/' + ${articolo.url}}" class="it-btn-yellow">
                                            <span><span class="text-1">Leggi la notizia</span><span class="text-2">Leggi la notizia</span></span>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div th:replace="~{site01/fragments/section_frag/_pagination :: nav}"></div>

                    <div class="alert alert-light text-center" th:if="${!section.hasContenuti()}">
                        Nessuna notizia disponibile al momento.
                    </div>
                </div>

                <div class="col-lg-4 ps-4 lg-ps-15px">
                    <div th:replace="~{site01/fragments/section_frag/_sidebar :: widget}"></div>
                </div>
            </div>
        </div>
    </section>
</th:block>
</body>
</html>
