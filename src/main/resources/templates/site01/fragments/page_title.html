<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- ========================================
     Banner di pagina (breadcrumb), ricostruito sul markup
     reale del tema Educeet (it-breadcrumb-area / it-breadcrumb-title /
     it-breadcrumb-list), come in Breadcrumb.tsx / BreadcrumbTwo.tsx
     del template originale. Le classi precedenti (page-title-big-typography,
     breadcrumb-style-01) non esistono nel CSS di Educeet: il banner
     risultava invisibile/non stilizzato.
     ======================================== -->
<th:block th:fragment="sectionTitle">
    <div class="it-breadcrumb-area fix z-index-1"
         th:style="${section != null and section.info5 != null and !section.info5.isEmpty() and section.info5 != '0'} ? 'background-image: url(' + ${config.imagesRepositoryWeb} + ${section.info5} + ');' : 'background-image: url(/site01/assets/img/shape/breadcrumb-1-bg.png);'">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-12">
                    <div class="it-breadcrumb-content text-center z-index-1">
                        <div class="it-breadcrumb-title-box">
                            <h3 class="it-breadcrumb-title" th:text="${section != null ? section.titolo : ''}">Titolo Sezione</h3>
                        </div>
                        <div class="it-breadcrumb-list-wrap">
                            <div class="it-breadcrumb-list">
                                <span><a th:href="@{/front}">Home</a></span>
                                <span class="dvdr" th:each="item : ${breadcrumb.items}">
                                    <i class="fas fa-chevron-right fs-12"></i>
                                </span>
                                <span th:each="item : ${breadcrumb.items}">
                                    <a th:href="${item.url}" th:text="${item.titolo}">Sezione</a>
                                </span>
                                <span class="dvdr"><i class="fas fa-chevron-right fs-12"></i></span>
                                <i th:text="${breadcrumb.itemAttuale}">Pagina</i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
<th:block th:fragment="documentTitle">
    <div class="it-breadcrumb-area fix z-index-1"
         th:style="${post != null and post.info5 != null and !post.info5.isEmpty() and post.info5 != '0'} ? 'background-image: url(' + ${config.imagesRepositoryWeb} + ${post.info5} + ');' : 'background-image: url(/site01/assets/img/shape/breadcrumb-1-bg.png);'">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-12">
                    <div class="it-breadcrumb-content text-center z-index-1">
                        <div class="it-breadcrumb-title-box">
                            <h3 class="it-breadcrumb-title" th:text="${post != null ? post.titolo : ''}">Titolo</h3>
                        </div>
                        <div class="it-breadcrumb-list-wrap">
                            <div class="it-breadcrumb-list">
                                <span><a th:href="@{/front}">Home</a></span>
                                <span class="dvdr" th:each="item : ${breadcrumb.items}">
                                    <i class="fas fa-chevron-right fs-12"></i>
                                </span>
                                <span th:each="item : ${breadcrumb.items}">
                                    <a th:href="${item.url}" th:text="${item.titolo}">Sezione</a>
                                </span>
                                <span class="dvdr"><i class="fas fa-chevron-right fs-12"></i></span>
                                <i th:text="${breadcrumb.itemAttuale}">Pagina</i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
