<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- content.section.sectionType.page4 = 'dettaglioPersona'
     Scheda della singola persona (staff/organigramma). Campi:
     titolo = nome, logo = foto, text1 = ruolo, riassunto = breve bio,
     text2 = "fa parte di", text4 = contatti, testo = bio estesa. -->
<th:block th:fragment="content">
    <section class="pb-100">
        <div class="container">
            <div class="row gx-35 justify-content-center">

                <div class="col-lg-4 col-md-5 mb-40">
                    <div class="it-team-thumb p-relative border-radius-20">
                        <img th:if="${post.logo != null and !post.logo.isEmpty()}"
                             class="w-100" th:src="${config.imagesRepositoryWeb + post.logo}" th:alt="${post.titolo}"/>
                        <img th:unless="${post.logo != null and !post.logo.isEmpty()}"
                             class="w-100" th:src="@{/site01/assets/img/team/team-1-1.jpg}" th:alt="${post.titolo}"/>
                    </div>
                </div>

                <div class="col-lg-7 col-md-7">
                    <h2 class="mb-10" th:text="${post.titolo}">Nome Cognome</h2>
                    <span th:if="${post.text1 != null and !post.text1.isEmpty()}" class="d-block mb-20 fw-600" style="color: var(--it-theme-1);" th:utext="${post.text1}">Ruolo</span>

                    <div th:if="${post.riassunto != null and !post.riassunto.isEmpty()}" class="mb-25" th:utext="${post.riassunto}"></div>

                    <ul class="list-unstyled mb-25" th:if="(${post.text2 != null and !post.text2.isEmpty()}) or (${post.text4 != null and !post.text4.isEmpty()})">
                        <li class="mb-10" th:if="${post.text2 != null and !post.text2.isEmpty()}">
                            <strong>Fa parte di:</strong> <span th:utext="${post.text2}"></span>
                        </li>
                        <li class="mb-10" th:if="${post.text4 != null and !post.text4.isEmpty()}">
                            <strong>Contatti:</strong> <span th:utext="${post.text4}"></span>
                        </li>
                    </ul>

                    <div th:if="${post.testo != null and !post.testo.isEmpty()}" th:utext="${post.testo}"></div>
                </div>

            </div>
        </div>
    </section>
</th:block>
</body>
</html>
