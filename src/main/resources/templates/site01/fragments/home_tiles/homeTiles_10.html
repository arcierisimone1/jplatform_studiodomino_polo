<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="homeTiles_10"
          th:with="s778=${@contentService.findSectionById(778).orElse(null)}, s779=${@contentService.findSectionById(779).orElse(null)}, s780=${@contentService.findSectionById(780).orElse(null)}, s781=${@contentService.findSectionById(781).orElse(null)}">
    <section class="it-categories-area pt-80 pb-95">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="it-categories-section-title-box text-center mb-50">
                        <span class="it-section-subtitle">I nostri partner</span>
                        <h4 class="it-section-title">Le nostre <span class="z-index-1">università</span></h4>
                    </div>
                </div>
            </div>

            <style>
                .uni-strip {
                    display: flex;
                    gap: 6px;
                    height: 420px;
                    border-radius: 26px;
                    overflow: hidden;
                    box-shadow: 0 25px 50px rgba(1, 6, 20, 0.15);
                }
                .uni-panel {
                    position: relative;
                    flex: 1;
                    min-width: 0;
                    display: block;
                    color: #fff;
                    text-decoration: none;
                    overflow: hidden;
                    transition: flex .55s cubic-bezier(.22,.68,.4,1);
                    background-color: #0a0b14;
                    background-size: cover;
                    background-repeat: no-repeat;
                    background-position: left bottom;
                }
                .uni-strip .uni-panel:hover { flex: 2.6; }

                /* fascia scura in basso con "Scopri di più" */
                .uni-panel::after {
                    content: "";
                    position: absolute;
                    left: 0; right: 0; bottom: 0;
                    height: 45%;
                    background: linear-gradient(to top, rgba(0,0,0,.65), rgba(0,0,0,0));
                    opacity: 0;
                    transition: opacity .35s ease;
                    pointer-events: none;
                }
                .uni-panel:hover::after { opacity: 1; }

                .uni-panel .cta {
                    position: absolute;
                    left: 26px;
                    bottom: 22px;
                    z-index: 2;
                    display: inline-flex;
                    align-items: center;
                    gap: 6px;
                    font-size: 14px;
                    font-weight: 700;
                    opacity: 0;
                    transform: translateX(-6px);
                    transition: opacity .3s ease .12s, transform .3s ease .12s;
                }
                .uni-panel:hover .cta {
                    opacity: 1;
                    transform: translateX(0);
                }
                @media (max-width: 768px) {
                    .uni-strip { flex-direction: column; height: auto; }
                    .uni-panel { flex: none !important; height: 200px; }
                    .uni-panel .cta { opacity: 1; transform: none; }
                    .uni-panel::after { opacity: 1; }
                }
            </style>

            <div class="uni-strip">

                <a th:href="@{/front/778/Università_Telematica_Pegaso}" class="uni-panel" aria-label="Università Pegaso"
                   th:style="'background-image:url(' + @{/site01/images/pegaso.png} + ');'">
                    <span class="cta">Scopri di più <i class="fa-solid fa-arrow-right"></i></span>
                </a>

                <a th:href="@{/front/779/Università_Telematica_Mercatorum}" class="uni-panel" aria-label="Università Mercatorum"
                   th:style="'background-image:url(' + @{/site01/images/mercatorum.png} + ');'">
                    <span class="cta">Scopri di più <i class="fa-solid fa-arrow-right"></i></span>
                </a>

                <a th:href="@{/front/780/Università_Telematica_San_Raffaele}" class="uni-panel" aria-label="Università San Raffaele"
                   th:style="'background-image:url(' + @{/site01/images/sanraffaele.png} + ');'">
                    <span class="cta">Scopri di più <i class="fa-solid fa-arrow-right"></i></span>
                </a>

                <a th:href="@{/front/781/Aulab}" class="uni-panel" aria-label="Aulab"
                   th:style="'background-image:url(' + @{/site01/images/aulab.png} + ');'">
                    <span class="cta">Scopri di più <i class="fa-solid fa-arrow-right"></i></span>
                </a>

            </div>
        </div>
    </section>
</th:block>
