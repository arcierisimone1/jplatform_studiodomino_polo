<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="homeTiles_00">
    <section class="it-hero-area theme-bg z-index-1 fix p-relative"
             th:if="${config != null and config.contenutiFront10 != null and !#lists.isEmpty(config.contenutiFront10)}">
        <img class="it-hero-shape-2" th:src="@{site01/assets/img/shape/hero-1-2.png}" alt=""/>
        <img class="it-hero-shape-3" th:src="@{site01/assets/img/shape/hero-1-3.png}" alt=""/>
        <div class="it-hero-shape-4"><img th:src="@{site01/assets/img/shape/hero-1-4.png}" alt=""/></div>

        <div id="slideShowHome" class="carousel slide w-100" data-ride="carousel" style="overflow:hidden">
            <div class="carousel-inner">
                <th:block th:each="articolo, iterStat : ${config.contenutiFront10}">
                    <div th:class="${'carousel-item' + (iterStat.first ? ' active' : '')}">
                        <img class="d-block w-100" th:src="${config.imagesRepositoryWeb + articolo.logo}" th:alt="${articolo.titolo}"/>
                        <div class="carousel-caption d-none d-md-block it-hero-content" th:utext="${articolo.testo}"></div>
                    </div>
                </th:block>
            </div>
            <a class="carousel-control-prev" href="#slideShowHome" role="button" data-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="sr-only">Previous</span>
            </a>
            <a class="carousel-control-next" href="#slideShowHome" role="button" data-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="sr-only">Next</span>
            </a>
        </div>
    </section>
</th:block>
